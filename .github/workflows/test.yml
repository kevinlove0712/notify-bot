name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '18'
            python: '3.10'
          - os: ubuntu-latest
            node: '22'
            python: '3.12'
          - os: ubuntu-latest
            node: '24'
            python: '3.14'
          - os: macos-latest
            node: '24'
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline tests
        run: python3 tests/run_tests.py
